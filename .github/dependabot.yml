version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    assignees:
      - 'iaslfw'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      tooling:
        patterns:
          - 'oxlint'
          - 'prettier*'
          - 'typescript'
          - 'linkedom'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react*'
          - '@base-ui/react'
          - 'lucide-react'
      styling:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'tw-animate-css'
          - '@fontsource-variable/*'
          - 'shadcn'
          - 'cn'
      cloudflare:
        patterns:
          - 'wrangler'
          - '@cloudflare/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'ci'
