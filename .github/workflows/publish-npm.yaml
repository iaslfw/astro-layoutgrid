name: Publish package

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace astro-layoutgrid
      - run: npm publish
        working-directory: packages/astro-layoutgrid
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
